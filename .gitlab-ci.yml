---
stages:
  - test
  - update-check
  - update

include:
  - component: $CI_SERVER_FQDN/fsrvcorp/ci-components/golang@0.1.0
  - component: $CI_SERVER_FQDN/fsrvcorp/ci-components/semver@0.1.0
    inputs:
      prefix: v

check update:
  image: registry.fsrv.services/fsrvcorp/container/debian-base:latest@sha256:56850ab480cadbf006018acc47a79a2d62ba3b1fed60e4f93d0a011489afe0db
  stage: update-check
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  before_script:
    - apt update
    - apt install -y curl python3 bash jq
  script:
    - export DEB_VERSION=$(curl https://sources.debian.org/api/src/distro-info-data/ | jq -r '.versions[0].version')
    - bash -x data/generator.sh ubuntu,debian $DEB_VERSION
    - echo "DEB_VERSION=$DEB_VERSION" > data.env
  artifacts:
    reports:
      dotenv:
        - data.env
    when: always
    paths:
      - data/*.json

commit_update:
  image: registry.fsrv.services/fsrvcorp/container/debian-base:latest@sha256:56850ab480cadbf006018acc47a79a2d62ba3b1fed60e4f93d0a011489afe0db
  stage: update
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  needs:
    - check update
  before_script:
    - apt update
    - apt install -y openssh-client jq python3
    - eval $(ssh-agent)
    - cat ${UPDATE_SSH_KEY} | ssh-add -
    - git config user.email "bot@fsrv.xyz"
    - git config user.name "gitlab-bot"
    - git remote remove update_origin || true
    - git remote add update_origin "git@$CI_SERVER_HOST:$CI_PROJECT_PATH.git"
    - mkdir ~/.ssh && ssh-keyscan -H $CI_SERVER_HOST >> ~/.ssh/known_hosts
  script:
    - |
      if test -n "$(git status --porcelain)"; then
        git checkout -b "update_deb_${DEB_VERSION}"
        git add data/*.json
        git commit -m "feat: update distro-info-data to ${DEB_VERSION}"
        git push --force update_origin HEAD -o merge_request.create \
          -o merge_request.target=${CI_DEFAULT_BRANCH} \
          -o merge_request.assign=${GITLAB_USER_LOGIN} \
          -o merge_request.title="feat: update distro-info-data to ${DEB_VERSION}" \
          -o merge_request.label="Source::CI"
      fi


